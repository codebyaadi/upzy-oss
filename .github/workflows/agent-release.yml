name: Agent release

# Push a tag like agent-v0.1.0 to build upzy-agent for every platform and attach the files to a GitHub release.
on:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
      - run: go test ./...
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#agent-v}"
          mkdir -p dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/upzy-agent-$os-$arch$ext" .
          done
          cd dist && sha256sum * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "upzy-agent $GITHUB_REF_NAME" --generate-notes
