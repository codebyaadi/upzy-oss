name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Known-vulnerable dependencies (bun.lock). Run directly instead of through the reusable workflow, which uploads
  # SARIF to GitHub code scanning: that is not available for private repositories without GitHub Advanced Security.
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan bun.lock
        run: |
          docker run --rm -v "$PWD":/src ghcr.io/google/osv-scanner:v2.0.2 \
            scan source --config=/src/osv-scanner.toml --lockfile=/src/bun.lock

  # Static analysis. Results are kept as a downloadable report and fail the job on error-level findings; uploading
  # to the Security tab needs GitHub Advanced Security on private repositories.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Private repositories: CodeQL reads the workflow run it belongs to.
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
      - name: Fail on error-level findings
        run: |
          n=$(jq -s '[.[].runs[].results[] | select(.level == "error")] | length' codeql-results/*.sarif)
          echo "error-level CodeQL findings: $n"
          if [ "$n" -gt 0 ]; then
            jq -r '.runs[].results[] | select(.level == "error") | "\(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' codeql-results/*.sarif
            exit 1
          fi
