id: upzy-exposure-phpinfo-php
info:
  name: "phpinfo() page is public (/phpinfo.php)"
  author: upzy
  severity: high
  description: "Reveals server paths, PHP settings and environment values."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/phpinfo.php"
http:
  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - 'PHP Version|phpinfo\(\)'
