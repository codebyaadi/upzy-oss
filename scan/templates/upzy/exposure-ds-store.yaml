id: upzy-exposure-ds-store
info:
  name: "macOS folder listing is public (/.DS_Store)"
  author: upzy
  severity: low
  description: "Lists file names in the folder, including ones that were not meant to be linked."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/.DS_Store"
http:
  - method: GET
    path:
      - "{{BaseURL}}/.DS_Store"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - 'Bud1'
