# Generated by scan/scripts/gen-templates.ts from packages/security/src/checks/active.ts. Do not edit.
id: upzy-exposure-config-json
info:
  name: "Configuration file is public (/config.json)"
  author: upzy
  severity: medium
  description: "The file contains values that look like credentials."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration. Rotate anything that was in it."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/config.json"
http:
  - method: GET
    path:
      - "{{BaseURL}}/config.json"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?i)"(?:password|secret|api[_-]?key|token|private[_-]?key)"\s*:'
