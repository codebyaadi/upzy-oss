# Generated by scan/scripts/gen-templates.ts from packages/security/src/checks/active.ts. Do not edit.
id: upzy-exposure-git-head
info:
  name: "Git repository is public (/.git/HEAD)"
  author: upzy
  severity: critical
  description: "The .git folder lets anyone download the full source code and its history, which often includes old secrets."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration. Deploy built files only, and rotate any secret that was ever committed."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/.git/HEAD"
http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?m)^ref: refs\/|^[0-9a-f]{40}\s*$'
