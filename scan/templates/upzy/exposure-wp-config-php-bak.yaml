id: upzy-exposure-wp-config-php-bak
info:
  name: "WordPress configuration backup is public (/wp-config.php.bak)"
  author: upzy
  severity: critical
  description: "Contains the database name, user and password, in plain text."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration. Then change the database password."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/wp-config.php.bak"
http:
  - method: GET
    path:
      - "{{BaseURL}}/wp-config.php.bak"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - 'DB_PASSWORD|DB_NAME'
