id: upzy-exposure-backup-sql
info:
  name: "Database dump is public (/backup.sql)"
  author: upzy
  severity: critical
  description: "A database dump contains your data, often including password hashes."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration. Treat the data as leaked."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/backup.sql"
http:
  - method: GET
    path:
      - "{{BaseURL}}/backup.sql"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?i)CREATE TABLE|INSERT INTO|-- MySQL dump|PostgreSQL database dump'
