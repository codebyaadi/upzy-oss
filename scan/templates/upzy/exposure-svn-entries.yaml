id: upzy-exposure-svn-entries
info:
  name: "Subversion metadata is public (/.svn/entries)"
  author: upzy
  severity: high
  description: "Exposes the project's file list and can allow downloading its source."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/.svn/entries"
http:
  - method: GET
    path:
      - "{{BaseURL}}/.svn/entries"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?m)^\d+\s*$|dir\s*$'
