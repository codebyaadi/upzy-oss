id: upzy-exposure-actuator-heapdump
info:
  name: "Spring Boot heap dump is public (/actuator/heapdump)"
  author: upzy
  severity: critical
  description: "A heap dump contains everything in memory, including sessions and passwords."
  remediation: "Disable the heapdump endpoint and put the management endpoints behind authentication."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/actuator/heapdump"
http:
  - method: GET
    path:
      - "{{BaseURL}}/actuator/heapdump"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '^JAVA PROFILE|^HPROF'
