# Generated by scan/scripts/gen-templates.ts from packages/security/src/checks/active.ts. Do not edit.
id: upzy-exposure-env
info:
  name: "Environment file is public (/.env)"
  author: upzy
  severity: critical
  description: "A .env file usually holds database passwords and API keys. Anyone can download them."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration. Then rotate every secret that was in it."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/.env"
http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?m)^\s*[A-Z][A-Z0-9_]{2,}\s*='
