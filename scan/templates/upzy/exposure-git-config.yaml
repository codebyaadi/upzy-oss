id: upzy-exposure-git-config
info:
  name: "Git configuration is public (/.git/config)"
  author: upzy
  severity: high
  description: "The git config can reveal the repository address and embedded access tokens."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/.git/config"
http:
  - method: GET
    path:
      - "{{BaseURL}}/.git/config"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?m)^\[core\]'
