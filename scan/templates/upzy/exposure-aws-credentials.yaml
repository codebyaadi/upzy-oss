id: upzy-exposure-aws-credentials
info:
  name: "AWS credentials file is public (/.aws/credentials)"
  author: upzy
  severity: critical
  description: "Gives anyone access to your AWS account with the key's permissions."
  remediation: "Remove the file from the web root, or deny the path in your web server configuration. Deactivate the keys in IAM and issue new ones."
  tags: upzy,exposure
  metadata:
    upzy-check-key: exposure.path
    upzy-subject: "/.aws/credentials"
http:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/credentials"
    max-size: 20000
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: regex
        part: body
        regex:
          - '(?i)aws_access_key_id|aws_secret_access_key'
